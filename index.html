<html lang="ko">

    <meta charset="UTF-8">

    <title>PhiMir AI & Tool 사전</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --dark: #1e293b;
            --light: #f8fafc;
            --border: #e2e8f0;
            --text: #334155;
            --hover: #4f46e5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px 0;
            margin-bottom: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .header-content {
            text-align: center;
        }

        h1 {
            font-size: 3em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text);
            font-size: 1.2em;
            opacity: 0.8;
        }

        .search-section {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        #searchInput {
            width: 100%;
            padding: 18px 50px 18px 20px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s;
        }

        #searchInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 20px;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 24px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            color: var(--text);
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-color: transparent;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .tool-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            border-color: var(--primary);
        }

        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .tool-name {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .tool-category {
            display: inline-block;
            padding: 5px 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .tool-description {
            color: var(--text);
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .tool-pricing {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .price-tag {
            padding: 6px 12px;
            background: var(--light);
            border-radius: 8px;
            font-size: 0.9em;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .price-tag strong {
            color: var(--primary);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            max-width: 900px;
            margin: 50px auto;
            border-radius: 20px;
            padding: 40px;
            position: relative;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.3);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: var(--text);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
            border: none;
            background: none;
        }

        .close-btn:hover {
            background: var(--light);
            color: var(--primary);
        }

        .modal h2 {
            color: var(--dark);
            margin-bottom: 20px;
            font-size: 2em;
        }

        .modal h3 {
            color: var(--primary);
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 1.4em;
        }

        .modal p, .modal ul {
            margin-bottom: 15px;
        }

        .modal ul {
            padding-left: 20px;
        }

        .modal li {
            margin-bottom: 8px;
        }

        .pdf-container {
            width: 100%;
            height: 600px;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin: 20px 0;
            overflow: hidden;
        }

        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .pdf-download-btn {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            margin: 10px 0;
            transition: transform 0.3s;
        }

        .pdf-download-btn:hover {
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            color: var(--text);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .tools-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 20px;
                padding: 25px;
            }

            .pdf-container {
                height: 400px;
            }
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);

        let currentFilter = 'all';
        let currentSearch = '';

        function renderTools() {
            const grid = document.getElementById('toolsGrid');
            const noResults = document.getElementById('noResults');
            
            let filteredTools = tools.filter(tool => {
                const matchesCategory = currentFilter === 'all' || 
                                       tool.category === currentFilter ||
                                       (currentFilter === '무료' && Object.values(tool.pricing).some(p => p.includes('무료') || p === '무료'));
                
                const matchesSearch = currentSearch === '' ||
                                     tool.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
                                     tool.description.toLowerCase().includes(currentSearch.toLowerCase());
                
                return matchesCategory && matchesSearch;
            });

            if (filteredTools.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            noResults.style.display = 'none';

            grid.innerHTML = filteredTools.map(tool => {
                const prices = Object.entries(tool.pricing).map(([key, value]) => 
                    `<span class="price-tag"><strong>${key}:</strong> ${value}</span>`
                ).join('');

                return `
                    <div class="tool-card" onclick="showModal('${tool.name}')">
                        <div class="tool-header">
                            <div>
                                <div class="tool-name">${tool.name}</div>
                                <span class="tool-category">${tool.category}</span>
                            </div>
                        </div>
                        <p class="tool-description">${tool.description}</p>
                        <div class="tool-pricing">${prices}</div>
                    </div>
                `;
            }).join('');
        }

        function showModal(toolName) {
            const tool = tools.find(t => t.name === toolName);
            const modal = document.getElementById('modal');
            const modalBody = document.getElementById('modalBody');

            const prices = Object.entries(tool.pricing).map(([key, value]) => 
                `<span class="price-tag"><strong>${key}:</strong> ${value}</span>`
            ).join('');

            let content = `
                <h2>${tool.name}</h2>
                <span class="tool-category">${tool.category}</span>
                <p style="margin-top: 20px;"><strong>설명:</strong> ${tool.description}</p>
                
                <div class="tool-pricing" style="margin-top: 15px;">${prices}</div>
            `;

            // PDF가 있는 경우
            if (tool.pdf) {
                content += `
                    <div style="margin: 20px 0;">
                        <a href="${tool.pdf}" class="pdf-download-btn" download>📥 PDF 다운로드</a>
                    </div>
                    <div class="pdf-container">
                        <iframe src="${tool.pdf}" type="application/pdf"></iframe>
                    </div>
                    <hr style="margin: 30px 0; border: none; border-top: 2px solid #eee;">
                    <h3 style="color: #667eea; margin-bottom: 20px;">📝 상세 정보</h3>
                `;
            }

            content += `
                <h3>주요 기능</h3>
                <ul>
                    ${tool.details.features.map(f => `<li>${f}</li>`).join('')}
                </ul>

                <h3>강점</h3>
                <ul>
                    ${tool.details.strengths.map(s => `<li>${s}</li>`).join('')}
                </ul>

                <h3>약점</h3>
                <ul>
                    ${tool.details.weaknesses.map(w => `<li>${w}</li>`).join('')}
                </ul>
            `;

            modalBody.innerHTML = content;
            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderTools();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.category;
                renderTools();
            });
        });

        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                closeModal();
            }
        });

        // Initial render
        renderTools();
    </script>
